# 協調器的極小端到端煙霧測試（非正式結果用）。
# 快速驗證 分階段搜尋 -> 排程 -> refit -> 彙整 整條流程是否串得起來。
experiment_name: smoke
seed: 42

data:
  data_dir:   /mnt/hot/public/Yi-Kuan/PE/original_size_crop51251296
  label_file: /mnt/hot/public/Yi-Kuan/PE/original_size_crop51251296/label.csv
  phase: T00
  cache_dir: /home/yikuan/PE_project/cache

model:
  pretrained_path: /home/yikuan/Yi-Kuan/Large-Scale-Medical-main/pretrained/VoComni_L.pt
  feature_size: 96
  in_channels: 1
  use_checkpoint: false

cv:
  outer_folds: 2        # 縮小折數以加速
  inner_folds: 2

training:
  epochs: 2             # 只跑 2 epoch（目的是驗證流程，非求效能）
  patience: 2
  batch_size: 1
  accum_steps: 4
  num_workers: 4
  lr: 1.0e-4
  weight_decay: 1.0e-5
  dropout: 0.0

hpsearch:
  stages:
    - name: lr           # 單一階段、兩個候選值
      values: [1.0e-4, 1.0e-5]

hardware:
  gpus: [0, 1, 2, 4]
  inner_epochs: 2
  inner_patience: 2

output:
  root: results
