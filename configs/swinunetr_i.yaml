# =====================================================================
# SwinUNETR-I : single-phase (inhalation / T00) PE classifier
#               單相位（吸氣 / T00）PE 分類器
# Nested cross-validation config (outer 10-fold, inner 5-fold)
# 巢狀交叉驗證設定（外層 10-fold、內層 5-fold）
# =====================================================================
experiment_name: swinunetr_i
seed: 42

data:
  # Preprocessed volumes: each .mat has T00 (inhale) + T50 (exhale), already cropped
  # to 512x512x96, HU-clipped and normalised to [0, 1].
  # 預處理過的體積：每個 .mat 含 T00（吸氣）與 T50（吐氣），已裁切成 512x512x96、HU 截斷並正規化到 [0,1]。
  data_dir:   /mnt/hot/public/Yi-Kuan/PE/original_size_crop51251296
  label_file: /mnt/hot/public/Yi-Kuan/PE/original_size_crop51251296/label.csv
  phase: T00            # single-phase uses inhalation only / 單相位模型只用吸氣
  # Fast-I/O cache of 256x256x96 float32 volumes (see scripts/precache.py).
  # 256x256x96 float32 體積的快取（加速 I/O，見 scripts/precache.py）。
  cache_dir: /home/yikuan/PE_project/cache

model:
  pretrained_path: /home/yikuan/Yi-Kuan/Large-Scale-Medical-main/pretrained/VoComni_L.pt
  feature_size: 96      # VoComni-L
  in_channels: 1
  use_checkpoint: false # gradient checkpointing off (80 GB GPU): faster, more memory / 關閉梯度檢查點：較快、較吃記憶體
  # Transfer-learning freeze strategy (see scripts/freeze_experiment.py):
  #   all (full fine-tune, best mean val AUC + matches paper) | freeze_swinvit
  #   | freeze_heavy (train ~12% params, faster/robust) | head_only (linear probe, fails)
  # 遷移學習的凍結策略：all（全微調，平均 AUC 略高且符合論文）| freeze_swinvit
  #   | freeze_heavy（只訓 ~12% 參數、較快/穩健）| head_only（線性探測，會失敗）
  freeze: all

cv:
  outer_folds: 10       # performance estimation / 效能估計
  inner_folds: 5        # hyper-parameter selection (nested) / 超參數選擇（巢狀）

training:
  epochs: 1000
  patience: 150         # early-stopping patience on validation AUC / 以驗證 AUC 做 early stopping 的耐心值
  batch_size: 1         # per-step batch on one GPU (the full model barely fits) / 單卡每步批次（完整模型勉強塞得下）
  accum_steps: 4        # gradient accumulation -> effective batch = 1 x 4 = 4 (paper) / 梯度累積 → 有效批次 4
  num_workers: 4
  # Default hyper-parameters; the search below overrides one at a time.
  # 預設超參數；下方的搜尋會一次覆寫其中一個。
  lr: 1.0e-4
  weight_decay: 1.0e-5
  dropout: 0.0

# Staged hyper-parameter search (as in the paper): tune one group at a time,
# freezing the best value before moving on.
# 分階段超參數搜尋（同論文）：一次只調一組，把勝出值固定後再進入下一階段。
hpsearch:
  stages:
    - name: lr
      values: [1.0e-3, 1.0e-4, 1.0e-5]
    - name: weight_decay
      values: [1.0e-3, 1.0e-4, 1.0e-5]
    - name: dropout
      values: [0.0, 0.1, 0.2]

hardware:
  # GPU 3 is the DGX Display (4 GB) -- skip it. CUDA_DEVICE_ORDER=PCI_BUS_ID is set
  # per-job so these ids match `nvidia-smi`.
  # GPU 3 是 DGX Display（4 GB）-- 略過。每個 job 會設 CUDA_DEVICE_ORDER=PCI_BUS_ID，讓 id 與 nvidia-smi 一致。
  gpus: [0, 1, 2, 4]
  # Inner-search trainings only *rank* HPs, so they use a reduced epoch budget
  # (refit uses the full training.epochs/patience). ~120 s/epoch on one A100
  # (bf16, batch 1); with 450 inner + 10 refit on 4 GPUs the full run is ~a week --
  # tune these (and grids / inner_folds) to trade rigour for wall-clock time.
  # 內層搜尋只用於「排序」超參數，故用較少 epoch（refit 才用完整 training.epochs/patience）。
  # 單張 A100 約 120 秒/epoch；450 內層 + 10 refit 在 4 卡上約需一週 -- 可調這些（與 grid / inner_folds）取捨時間。
  inner_epochs: 100
  inner_patience: 20

output:
  root: results         # everything lands in results/<experiment_name>/ / 所有產物落在 results/<experiment_name>/
