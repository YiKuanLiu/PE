# Recreate the runtime env:
#   conda env create -f environment.yml
#   conda activate PE
#   pip install torch==2.3.1 torchvision==0.18.1 --index-url https://download.pytorch.org/whl/cu121
# (torch is intentionally NOT pinned here so the CUDA build matches the host driver.)
name: PE
channels:
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      - monai==1.3.0
      - scikit-learn==1.3.2
      - scipy==1.11.4
      - pandas
      - "numpy<2"
      - nibabel
      - einops
      - tqdm
      - tensorboard
      - h5py
      - matplotlib
      - pyyaml
